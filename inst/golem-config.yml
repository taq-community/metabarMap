default:
  golem_name: metabarMap
  golem_version: 0.0.0.9000
  app_prod: no
  project_logo: "img/partners/logo-ville-rouyn-noranda.png"
  project_name: "Résultats d'étude métabarcoding pour la région de Rouyn-Noranda"
  station_ids: ["Lac Beauchastel","Lac Buies","Lac Dufault I","Lac Dufault II","Lac Fortune","Lac Joannès","Lac Kanasuta","Lac Montbeillard","Lac Vaudray"]
  default_station: "Lac Vaudray"
  methodology_file: "methodology.md"
  excluded_species:
    - genus: "Bos"
      species: "taurus"
    - genus: "Homo"
      species: "sapiens"
    - genus: "Sus"
      species: "scrofa"
  partners:
    - name: "INRS"
      max_height: "70px"
      url: "https://inrs.ca/"
      image: "img/partners/inrs.png"
production:
  app_prod: yes
dev:
  golem_wd: !expr golem::pkg_path()
